<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ restaurant_settings.restaurantName }} Kitchen</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body>
  <header class="header"><div class="header-inner"><img class="brand-logo" src="{{ url_for('static',filename='logo.png') }}" alt="SwipeEat logo"><span><a class="nav-link" href="{{ url_for('admin') }}">Admin Dashboard</a> <button type="button" id="sound-toggle" class="button ghost" aria-pressed="false">Sound off</button> <span id="live" class="live" role="status">Connecting</span><span id="toast" role="status"></span></span></div></header>
  <main class="page"><p class="eyebrow">{{ restaurant_settings.restaurantName }} Kitchen</p><h1>Service board</h1><p id="kitchen-error" class="status error" role="alert" hidden></p><div class="tabs" id="tabs"></div><section class="staff-board" id="orders"><section class="staff-column" data-status="new"><h2>New</h2><div class="tickets"></div></section><section class="staff-column" data-status="preparing"><h2>Preparing</h2><div class="tickets"></div></section><section class="staff-column" data-status="completed"><h2>Ready / Completed</h2><div class="tickets"></div></section></section></main>
  <script>
    const CSRF_TOKEN="{{ csrf_token() }}";
    const statuses=["active","new","preparing","completed","cancelled"];
    let current="active"; let soundEnabled=false;
    const tabs=document.getElementById("tabs");
    const ordersEl=document.getElementById("orders");
    let latestSeenOrderId=null;
    function badge(value){return `<span class="badge badge-${value}">${value}</span>`;}
    function escapeHtml(value){return String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));}
    document.getElementById("sound-toggle").onclick=event=>{soundEnabled=!soundEnabled;event.currentTarget.textContent=soundEnabled?"Sound on":"Sound off";event.currentTarget.setAttribute("aria-pressed",String(soundEnabled));};
    function notifyNewOrder(id){const toast=document.getElementById("toast");toast.textContent="New order #"+id;setTimeout(()=>toast.textContent="",2500);if(!soundEnabled)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();osc.frequency.value=880;osc.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close();},120);}catch(e){}}
    function renderTabs(){tabs.innerHTML="";statuses.forEach(status=>{const button=document.createElement("button");button.className="tab"+(status===current?" active":"");button.textContent=status;button.type="button";button.onclick=()=>{current=status;renderTabs();refresh();};tabs.appendChild(button);});}
    async function setStatus(id,status){if(status==="cancelled"&&!confirm("Cancel this order?"))return;try{const response=await fetch(`/admin/orders/${id}`,{method:"PUT",headers:{"Content-Type":"application/json","X-CSRF-Token":CSRF_TOKEN},body:JSON.stringify({status})});const data=await response.json();if(!response.ok)throw Error(data.error||"Could not update order.");refresh();}catch(error){showError(error.message);}}
    function showError(message){const target=document.getElementById("kitchen-error");target.textContent=message;target.hidden=false;document.getElementById("live").textContent="Needs attention";}
    async function setEta(id){const input=document.querySelector(`.eta-input[data-order-id="${id}"]`);try{const response=await fetch(`/admin/orders/${id}/eta`,{method:"PUT",headers:{"Content-Type":"application/json","X-CSRF-Token":CSRF_TOKEN},body:JSON.stringify({estimatedMinutes:input?input.value:0})});const data=await response.json();if(!response.ok)throw Error(data.error||"Could not update estimate.");refresh();}catch(error){showError(error.message);}}
    function nextButtons(order){const buttons=[];if(order.status==="new")buttons.push(`<button class="secondary" onclick="setStatus(${order.id},'preparing')">Start Preparing</button>`);if(order.status==="preparing")buttons.push(`<button class="secondary" onclick="setStatus(${order.id},'completed')">Complete Order</button>`);if(order.status!=="cancelled"&&order.status!=="completed")buttons.push(`<button class="danger" onclick="setStatus(${order.id},'cancelled')">Cancel</button>`);return buttons.join("");}
    async function refresh(){
      document.getElementById("live").textContent="Updating";
      try{
        const response=await fetch(`/admin/orders?status=${current}`);
        if(!response.ok)throw Error("Could not load orders. Retry in a moment.");
        const data=await response.json();
        if(current==="active"){
          const completedResponse=await fetch('/admin/orders?status=completed');
          if(completedResponse.ok){const completed=await completedResponse.json();data.orders.push(...(completed.orders||[]).slice(0,6));}
        }
        document.getElementById("kitchen-error").hidden=true;
        document.querySelectorAll(".staff-column .tickets").forEach(column=>column.replaceChildren());
        const newest=data.orders.length?data.orders[0].id:null;
        if(newest&&latestSeenOrderId&&newest>latestSeenOrderId)notifyNewOrder(newest);
        if(newest)latestSeenOrderId=newest;
        data.orders.forEach(order=>{
          const column=document.querySelector(`.staff-column[data-status="${order.status}"] .tickets`);
          if(!column)return;
          const article=document.createElement("article");article.className="order"+(order.isDelayed?" delayed":"");
          const items=(order.items||[]).map(item=>`<div class="item-row"><strong>${escapeHtml(item.mealName)} x${item.quantity}</strong>${item.notes?`<br><span>${escapeHtml(item.notes)}</span>`:""}</div>`).join("");
          article.innerHTML=`<h3>Table ${escapeHtml(order.tableNumber||"not set")} &middot; #${order.id}</h3><div class="timer">${order.statusAgeMinutes||0} min waiting &middot; ETA ${order.estimatedMinutes||0} min</div><div class="badges">${badge(order.paymentStatus)}</div><div class="item-list">${items}</div>${order.notes?`<div class="note">${escapeHtml(order.notes)}</div>`:""}<div class="eta-row"><input class="eta-input" data-order-id="${order.id}" type="number" min="0" max="180" value="${order.estimatedMinutes||0}" aria-label="ETA minutes"><button class="secondary" onclick="setEta(${order.id})">Update ETA</button></div><div class="actions">${nextButtons(order)}</div>`;
          column.appendChild(article);
        });
        document.querySelectorAll(".staff-column .tickets").forEach(column=>{if(!column.children.length){const empty=document.createElement("p");empty.className="quiet";empty.textContent="No tickets here.";column.append(empty);}});
        document.getElementById("live").textContent="Live";
      }catch(error){showError(error.message);}
    }
    function connectOrderEvents(){if(!window.EventSource)return;const events=new EventSource("/admin/events");events.addEventListener("open",()=>document.getElementById("live").textContent="Live");events.addEventListener("order_created",event=>{try{const data=JSON.parse(event.data);if(data.orderId)notifyNewOrder(data.orderId);}catch(e){}refresh();});events.addEventListener("order_updated",refresh);events.addEventListener("payment_updated",refresh);events.addEventListener("eta_updated",refresh);events.addEventListener("error",()=>document.getElementById("live").textContent="Reconnecting");}
    renderTabs();connectOrderEvents();refresh();setInterval(refresh,30000);
  </script>
</body>
</html>
