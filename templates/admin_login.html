<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body>
  <main class="login-shell"><section class="login-panel surface"><img class="brand-logo" src="{{ url_for('static',filename='logo.png') }}" alt="SwipeEat logo"><p class="eyebrow">Staff access</p><h1>Welcome back</h1>
    <p>Sign in to continue to {{ 'kitchen' if next_url.startswith('/kitchen') else 'admin' }}.</p>
    {% if error %}<p class="status error" role="alert">{{ error }}</p>{% endif %}
    <form method="POST" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label>Username<input name="username" autocomplete="username" value="{{ username }}" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Sign in</button>
    </form>
  </section></main>
</body>
</html>
