<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwipeEat | Find your next favourite dish</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body><header class="header"><div class="header-inner"><img class="brand-wordmark" src="{{ url_for('static',filename='wordmark.svg') }}" alt="SwipeEat"><a href="{{ url_for('landing') }}">How it works</a></div></header><main class="shell"><section class="welcome-hero"><div><p class="eyebrow">Your table. Your taste.</p><h1>Find your next favourite dish</h1><p>Explore the real menu, find a match for your taste, and send your order to the kitchen from your table.</p><div class="action-row"><a class="button" href="{{ url_for('menu',table=request.args.get('table','')) }}">Browse menu</a><a class="button secondary" href="{{ url_for('food_swipe',table=request.args.get('table','')) }}">Find my match</a></div></div><img src="{{ featured_meal.img if featured_meal else url_for('static',filename='wordmark.svg') }}" alt="{{ featured_meal.name if featured_meal else 'SwipeEat plate' }}"></section></main></body></html>
